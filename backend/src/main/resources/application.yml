spring:
  application:
    name: roomledger
  datasource:
    # Defaults match .env.example for local development; real environments override them.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roomledger}
    username: ${DB_USERNAME:roomledger}
    password: ${DB_PASSWORD:roomledger}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    # Keep DB sessions inside the service layer instead of the whole HTTP request.
    open-in-view: false

app:
  jwt:
    # No default on purpose: the app refuses to start without a secret.
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:1h}

management:
  endpoints:
    web:
      exposure:
        include: health
