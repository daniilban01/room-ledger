# Production stack for a single server (AWS EC2). Differences from docker-compose.yml (local):
# - uses images built by GitHub Actions instead of building on the server
# - Postgres and the backend are NOT reachable from the internet, only from other containers
# - Caddy in front terminates HTTPS with an automatic Let's Encrypt certificate
# - containers restart on failure and after a server reboot
#
# Run on the server:  docker compose -f docker-compose.prod.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX in .env}-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      # The JVM sizes its heap from the container limit below, leaving room for non-heap memory.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    # A hard cap so a memory leak cannot take down Postgres and the whole 2 GB server with it.
    mem_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    image: ${IMAGE_PREFIX}-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    # The only ports open to the internet. Port 80 is needed for the certificate challenge
    # and redirects to HTTPS.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here; keeping them avoids asking Let's Encrypt again on every restart.
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    depends_on:
      - frontend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
