name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # verify = compile + unit tests + Testcontainers integration tests + JaCoCo report and coverage check
      - run: ./mvnw -B verify
      # Coverage totals on the run's summary page. jacoco.csv columns: 6-7 = branches missed/covered,
      # 8-9 = lines missed/covered. "always()" so the numbers also show when the coverage check failed.
      - name: Coverage summary
        if: always() && hashFiles('backend/target/site/jacoco/jacoco.csv') != ''
        run: |
          awk -F, 'NR > 1 { bm += $6; bc += $7; lm += $8; lc += $9 }
            END { printf "### Backend test coverage\n\n| Lines | Branches |\n|---|---|\n| %.1f%% | %.1f%% |\n",
                  100 * lc / (lm + lc), 100 * bc / (bm + bc) }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
      # The full HTML report (which lines are covered), downloadable from the run page.
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('backend/target/site/jacoco/index.html') != ''
        with:
          name: coverage-report
          path: backend/target/site/jacoco/
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # Builds the images on every run (so a broken Dockerfile fails the PR) and, only for pushes
  # to main, publishes them to GitHub Container Registry for the server to download.
  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets the built-in GITHUB_TOKEN push to ghcr.io; no extra secret needed
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
      # Image names must be lowercase; the GitHub user name may not be.
      - run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/roomledger" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Two tags: "latest" for convenience and the commit SHA, so every deploy is traceable
      # and an older version can be redeployed exactly.
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.IMAGE_PREFIX }}-backend:latest,${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.IMAGE_PREFIX }}-frontend:latest,${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # Continuous deployment: after tests pass and images are published, update the server over SSH.
  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Never run two deployments at the same time; a newer one waits for the current one.
    concurrency: production
    steps:
      # Plain ssh instead of a third-party action: one less dependency with access to our secrets.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key: if the server's identity ever changes, the deploy refuses to connect.
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Pull the new images and restart
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            set -e
            cd ~/roomledger
            git pull --ff-only
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
          "
