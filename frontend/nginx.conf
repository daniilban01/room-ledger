server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS. With a hostname in a variable, nginx re-resolves "backend"
    # at request time instead of caching its IP once at startup, so a restarted backend
    # container (which may get a new IP) is found again.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;

    # Same idea as the Vite dev proxy: the browser sees one origin, nginx forwards API calls.
    location /api/ {
        proxy_pass $backend;
        # Reading a receipt can take a while (slow model + up to 3 attempts). nginx's default of 60s
        # would cut the request off with a 504 while the backend is still working on it.
        proxy_read_timeout 150s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass $backend;
    }

    # SPA fallback: unknown paths (e.g. /groups/123) are handled by the React router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
